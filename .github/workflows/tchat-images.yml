# Publishes the three Tchat deployment images at the full commit SHA.
#
# tchat-librechat is this fork's own LibreChat build; tchat-api wraps it with the
# Doppler entrypoint; tchat-broker is the gateway broker. All three come from
# this repository, so a change anywhere in the app source reaches production.
#
# Immutable tags only: the Komodo stack pins an exact 40-character SHA, matching
# the TensorGrid release contract. A moving tag would make a redeploy silently
# change what runs.
#
# Doc-only edits under these paths rebuild too. Predictable beats clever, and
# the layer cache makes a no-op rebuild cheap.
name: Tchat images

on:
  push:
    branches: [main]
    paths:
      - 'deploy/tchat/**'
      - '.github/workflows/tchat-images.yml'
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'config/**'
      - 'skill/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tchat-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  broker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      # No dependencies to install: the broker runs on the Node standard library.
      - name: Test
        working-directory: deploy/tchat/broker
        run: node --test src/*.test.js

  config-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/deploy/tchat/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/tchat/branding:/srv/branding:ro" \
            nginx:1.29-alpine nginx -t
      - name: Compose renders with no unset required variables
        working-directory: deploy/tchat
        env:
          TCHAT_IMAGE_TAG: ${{ github.sha }}
          DOPPLER_TOKEN: dp.st.ci.placeholder
          MEILI_MASTER_KEY: ci-placeholder
          TCHAT_VECTOR_USER: ci
          TCHAT_VECTOR_PASSWORD: ci
          ADMIN_PANEL_SESSION_SECRET: ci-placeholder
        run: docker compose -f compose.production.yml config --quiet

  # This fork's LibreChat, built from the source in this repository. tchat-api
  # is FROM this image, so it must exist at this SHA before that build starts.
  librechat-image:
    needs: [broker-tests, config-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tchat-librechat:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          # Surfaced in Settings -> About, which is how a running container
          # answers "which commit is this?" during an incident.
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=tchat-librechat
          cache-to: type=gha,mode=max,scope=tchat-librechat

  publish:
    needs: [broker-tests, config-checks, librechat-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: tchat-api
            dockerfile: deploy/tchat/Dockerfile.api
            build_args: |
              LIBRECHAT_IMAGE=ghcr.io/${{ github.repository_owner }}/tchat-librechat
              LIBRECHAT_TAG=${{ github.sha }}
          - image: tchat-broker
            dockerfile: deploy/tchat/broker/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Both Dockerfiles read from deploy/tchat, which keeps the build
          # context small and independent of the LibreChat monorepo.
          context: deploy/tchat
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          build-args: ${{ matrix.build_args }}

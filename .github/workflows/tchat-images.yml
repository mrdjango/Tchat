# Publishes the two Tchat deployment images at the full commit SHA.
#
# Immutable tags only: the Komodo stack pins an exact 40-character SHA, matching
# the TensorGrid release contract. A moving tag would make a redeploy silently
# change what runs.
name: Tchat images

on:
  push:
    branches: [main]
    paths:
      - 'deploy/tchat/**'
      - '.github/workflows/tchat-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tchat-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  broker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      # No dependencies to install: the broker runs on the Node standard library.
      - name: Test
        working-directory: deploy/tchat/broker
        run: node --test src/*.test.js

  config-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/deploy/tchat/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/tchat/branding:/srv/branding:ro" \
            nginx:1.29-alpine nginx -t
      - name: Compose renders with no unset required variables
        working-directory: deploy/tchat
        env:
          TCHAT_IMAGE_TAG: ${{ github.sha }}
          DOPPLER_TOKEN: dp.st.ci.placeholder
          MEILI_MASTER_KEY: ci-placeholder
          TCHAT_VECTOR_USER: ci
          TCHAT_VECTOR_PASSWORD: ci
        run: docker compose -f compose.production.yml config --quiet

  publish:
    needs: [broker-tests, config-checks]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: tchat-api
            dockerfile: deploy/tchat/Dockerfile.api
          - image: tchat-broker
            dockerfile: deploy/tchat/broker/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Both Dockerfiles read from deploy/tchat, which keeps the build
          # context small and independent of the LibreChat monorepo.
          context: deploy/tchat
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false

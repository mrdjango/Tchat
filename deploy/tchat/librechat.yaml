# Tchat — LibreChat configuration for chat.tensorgrid.space
#
# Bind-mounted to /app/librechat.yaml. The upstream repo gitignores
# `librechat.yaml`, so the real config lives here under deploy/tchat/ where
# `git merge upstream/main` will never touch it.
#
# Every model call leaves through the Tchat broker, which swaps the shared
# ingress key for the signed-in user's own Models Gateway token before
# forwarding to api.tensorgrid.space. Users never see that token and cannot
# point Tchat at any other provider.

version: 1.3.14
cache: true

interface:
  customWelcome: 'Welcome to Tchat — TensorGrid models, billed to your TensorGrid credit.'
  privacyPolicy:
    externalUrl: 'https://tensorgrid.space/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://tensorgrid.space/terms'
    openNewTab: true
  # Users pick any model the Gateway catalog offers. Safe to enable because
  # `modelSpecs.enforce` is off; with it on, the UI could offer a selection
  # carrying no spec, which the server then rejects as "No model spec selected".
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileSearch: true
  fileCitations: true
  feedback: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  # No third-party agent marketplace: everything Tchat can reach must route
  # through the TensorGrid endpoints below.
  marketplace:
    use: false

registration:
  # OpenID is the only social provider Tchat will ever accept, and it points at
  # TensorGrid. Until the Django IdP exists this list is inert because
  # ALLOW_SOCIAL_LOGIN is false — see deploy/tchat/OIDC.md.
  socialLogins: ['openid']

endpoints:
  # Only these two exist. Built-in providers are additionally switched off with
  # `ENDPOINTS=agents`, and no provider API key is ever present in the
  # environment, so there is nothing for a user to select or configure.
  custom:
    - name: 'TensorGrid'
      apiKey: '${TCHAT_BROKER_SHARED_KEY}'
      baseURL: '${TCHAT_BROKER_BASE_URL}'
      # Resolved per request from the signed-in LibreChat user. The broker
      # trades these for that user's Gateway token; it refuses the request
      # outright when they are absent.
      headers:
        X-Tchat-User-Id: '{{LIBRECHAT_USER_ID}}'
        X-Tchat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
        X-Tchat-User-Openid: '{{LIBRECHAT_USER_OPENIDID}}'
      models:
        # Live from the Gateway catalog via /v1/models through the broker, so
        # adding a model in the Gateway admin publishes it here with no redeploy.
        fetch: true
        # Shown before the first successful fetch, and whenever the Gateway is
        # unreachable. Every id below is verified present in the catalog;
        # embedding and transcription models are deliberately left out because
        # they cannot serve a chat completion.
        default:
          - 'gpt-5.6-terra'
          - 'gpt-5.6-sol'
          - 'gpt-5.6-luna'
          - 'gpt-5.5'
          - 'gpt-5.4'
          - 'gpt-5.4-mini'
          - 'claude-opus-5'
          - 'claude-sonnet-5'
          - 'claude-haiku-4-5'
          - 'deepseek-v4-flash'
          - 'deepseek-ai/deepseek-v4-pro-0813'
          - 'moonshotai/kimi-k3'
          - 'minimaxai/minimax-m3'
          - 'nvidia/nemotron-3-super-120b-a12b'
          - 'openai/gpt-oss-120b'
          - 'openai/gpt-oss-20b'
          - 'Qwen/Qwen3.6-35B-A3B-FP8'
          - 'Qwen3.8-27B'
      titleConvo: true
      # Titles bill the same as any other call, so they use the cheapest model
      # in the catalog rather than whatever the conversation is running on.
      titleModel: 'gpt-5.4-mini'
      modelDisplayLabel: 'TensorGrid'
      iconURL: '/images/tchat-mark.svg'

    - name: 'TensorGrid-Claude'
      # Native Anthropic /v1/messages against the Gateway's Claude-compatible
      # relay. The Anthropic client authenticates with x-api-key, which the
      # broker accepts alongside bearer tokens.
      provider: 'anthropic'
      apiKey: '${TCHAT_BROKER_SHARED_KEY}'
      baseURL: '${TCHAT_BROKER_BASE_URL}'
      headers:
        anthropic-version: '2023-06-01'
        X-Tchat-User-Id: '{{LIBRECHAT_USER_ID}}'
        X-Tchat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
        X-Tchat-User-Openid: '{{LIBRECHAT_USER_OPENIDID}}'
      models:
        # The Anthropic provider has no /models convention to auto-fetch, so
        # these are listed explicitly and must exist in the Gateway catalog.
        fetch: false
        default:
          - 'claude-opus-5'
          - 'claude-sonnet-5'
          - 'claude-fable-5'
          - 'claude-opus-4-8'
          - 'claude-opus-4-7'
          - 'claude-opus-4-6'
          - 'claude-sonnet-4-6'
          - 'claude-haiku-4-5'
      titleConvo: true
      titleModel: 'claude-haiku-4-5'
      modelDisplayLabel: 'TensorGrid Claude'
      iconURL: '/images/tchat-mark.svg'

# Starting points, not a whitelist. Provider lockdown is done by there being
# exactly two endpoints, both aimed at the broker, with no provider API key
# anywhere in the deployment — `enforce` would additionally freeze the model
# list, which stops users choosing from the Gateway catalog they are paying for.
modelSpecs:
  enforce: false
  prioritize: true
  addedEndpoints: []
  list:
    - name: 'tensorgrid-default'
      label: 'TensorGrid'
      description: 'General-purpose chat on TensorGrid models, billed to your TensorGrid credit.'
      default: true
      preset:
        endpoint: 'TensorGrid'
        model: 'gpt-5.6-terra'

    - name: 'tensorgrid-claude'
      label: 'TensorGrid Claude'
      description: 'Anthropic Claude models served through the TensorGrid gateway.'
      preset:
        endpoint: 'TensorGrid-Claude'
        model: 'claude-sonnet-5'

  # Image models offered behind the chat input's Image Gen toggle. Deliberately
  # not in `list` above: those are chat models and populate the model selector,
  # and a spec hidden from that menu never reaches the client at all. Adding a
  # model the Gateway already serves is three lines here — no image rebuild,
  # since this file is Komodo-tracked.
  #
  # `protocol: gemini` routes through the tool that speaks Google's own API,
  # which the Gateway relays natively. It is required for `gemini-*-image`
  # models: the Gateway's OpenAI image endpoint serves the `imagen` family only.
  #
  # Only models verified reachable are listed. The catalog also carries
  # `gpt-image-2-4k` (no channel serves it for group `pro`) and
  # `gemini-3.1-flash-image-c` (tokens have no access to it); add them here once
  # the Gateway grants them, because an entry that 403s is worse than no entry.
  # Note that /v1/models is per user, so catalog visibility is not access.
  imageList:
    - name: 'gpt-image'
      label: 'GPT Image'
      description: "OpenAI's image model. Generation and editing."
      model: 'gpt-image-2'
      default: true

    - name: 'gemini-image'
      label: 'Gemini Image'
      description: "Google's Gemini 3 Pro image model."
      model: 'gemini-3-pro-image-c'
      protocol: 'gemini'


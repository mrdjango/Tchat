# Tchat branding layer.
#
# The LibreChat client is prebuilt inside the upstream image: `client/dist`
# bakes in <title>LibreChat</title>, the favicon links, the PWA manifest and
# assets/logo.svg, and it is served ahead of client/public/assets — so a volume
# mount cannot override any of them. Rewriting them here keeps the rebrand
# entirely in deployment config and leaves every LibreChat source file
# untouched, so `git merge upstream/main` stays clean.
#
# TensorGrid's edge nginx terminates TLS and proxies chat.tensorgrid.space to
# this server over the shared `tchat_edge` network. This server listens on
# plain HTTP and is never published to the host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The edge always sets this. Defaulting to https keeps a direct hit on this
# server (a healthcheck, a debug curl) from telling the app it is running
# insecurely, which would drop the Secure flag on session cookies.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

# Admin console, on its own hostname so it never shares the chat login surface.
# TensorGrid's edge nginx routes tchat-admin.tensorgrid.space here and is where
# Cloudflare Access is enforced; this server is not reachable any other way.
server {
    listen 80;
    server_name tchat-admin.tensorgrid.space;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # Variable upstream so nginx still starts when the panel is down, rather
    # than failing to resolve at boot and taking the chat vhost with it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tchat_admin http://tchat-admin:3000;

    location / {
        proxy_pass $tchat_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Forwarded so the panel can see the Access identity if it ever needs it.
        proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    }
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    # Branded assets replace the LibreChat originals at the exact paths the
    # built bundle requests.
    location = /assets/logo.svg              { alias /srv/branding/logo.svg; }
    location = /assets/favicon-16x16.png     { alias /srv/branding/favicon-16x16.png; }
    location = /assets/favicon-32x32.png     { alias /srv/branding/favicon-32x32.png; }
    location = /assets/apple-touch-icon-180x180.png { alias /srv/branding/apple-touch-icon-180x180.png; }
    location = /assets/icon-192x192.png      { alias /srv/branding/icon-192x192.png; }
    location = /assets/maskable-icon.png     { alias /srv/branding/maskable-icon.png; }
    location = /manifest.webmanifest {
        alias /srv/branding/manifest.webmanifest;
        default_type application/manifest+json;
    }

    # Endpoint icon referenced by `iconURL` in librechat.yaml. LibreChat serves
    # /images from a writable volume, so this alias keeps the mark in the image
    # rather than requiring an upload.
    location = /images/tchat-mark.svg { alias /srv/branding/tchat-mark.svg; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        # Variable upstream + Docker's embedded resolver so this server still
        # starts when tchat-api is restarting or not yet healthy. With no URI
        # part in the value, nginx forwards the original request URI unchanged.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tchat_api http://tchat-api:3080;
        proxy_pass $tchat_api;
        proxy_http_version 1.1;

        # SSE token streams must not be buffered or the reply arrives in one lump.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The app compresses its own responses, which would leave sub_filter
        # nothing to match. Asking upstream for plaintext costs nothing here:
        # the edge nginx compresses again on the way out.
        proxy_set_header Accept-Encoding "";

        # APP_TITLE already renames the tab once the SPA hydrates. These cover
        # the pre-hydration flash, no-JS clients, and link unfurls.
        # sub_filter_types defaults to text/html, which is all we rewrite.
        sub_filter_once off;
        sub_filter '<title>LibreChat</title>' '<title>Tchat</title>';
        sub_filter 'LibreChat - An open source chat application with support for multiple AI models'
                   'Tchat - TensorGrid chat, powered by api.tensorgrid.space';
    }
}
